<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Reset your password</title>
  </head>
  <body
    style="
      margin: 0;
      background: #0b0c14;
      color: #eceef5;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <div style="display: none; max-height: 0; overflow: hidden">
      Tap the button to choose a new password for StormSync Weather.
    </div>
    <div style="max-width: 520px; margin: 0 auto; padding: 28px 24px">
      <p
        style="
          color: #d9b76f;
          font-size: 12px;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          margin: 0;
        "
      >
        StormSync Weather
      </p>
      <h1 style="font-size: 24px; color: #ffffff; margin: 8px 0 14px">
        Reset your password
      </h1>
      <p style="line-height: 1.55; margin: 0 0 22px">
        Tap the button to choose a new password for StormSync Weather.
      </p>
      <p style="margin: 0 0 22px">
        <a
          href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/"
          style="
            display: inline-block;
            padding: 12px 22px;
            border: 1px solid #d9b76f;
            border-radius: 999px;
            color: #d9b76f;
            text-decoration: none;
            font-weight: bold;
          "
          >Reset password</a
        >
      </p>
      <p
        style="
          line-height: 1.5;
          color: #8f92a8;
          font-size: 13px;
          margin: 0 0 8px;
        "
      >
        If you didn't ask for this, ignore this email.
      </p>
      <p style="color: #8f92a8; font-size: 12px; margin: 18px 0 0">
        StormSync Weather · weather.sswx.space
      </p>
    </div>
  </body>
</html>
