name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, format, test, build, budget
    runs-on: ubuntu-latest
    # Public values only (they ship in the browser bundle); repository variables override them.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://katgjzkvscexswsqqooi.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_gl-0xbHB22lo7Tws3Lbb1Q_1lhncD_m' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
      # The gate: a route that outgrows its JavaScript budget fails the build.
      - run: npm run perf:budget
      # The guest front door in a real browser: bad status, crash or blank page fails.
      - name: Smoke test
        run: |
          npx playwright install --with-deps chromium
          npm run start -- -p 3000 &
          BASE_URL=http://localhost:3000 npm run smoke
