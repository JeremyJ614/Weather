name: Scheduled jobs

# The heavy scheduled jobs, run here instead of on Vercel (post-launch A1 "cost-guard"): free
# and unlimited for a public repository. No secrets: the job proves itself with GitHub's OIDC
# token and reads and writes the database through the site's relay (/api/jobs/sb), which checks
# that token. JOBS_ON_ACTIONS=1 in Vercel makes the database scheduler's calls stand down.
on:
  schedule:
    - cron: "7,27,47 * * * *" # engine maps (as pg_cron engine-maps)
    - cron: "37 * * * *" # Deer and Fishing outlooks (engine-outdoor)
    - cron: "41 * * * *" # engine report cards (engine-verify)
    - cron: "8,18,28,38,48,58 * * * *" # lightning surges (engine-surge)
    - cron: "23 9 * * *" # sitemap to IndexNow (Bing and others), daily
  workflow_dispatch:
    inputs:
      job:
        description: "engines, outdoor, verify, surge, indexnow, sizes, usage, cron or export"
        required: true
        default: engines
      arg:
        description: "For cron: the route, e.g. patterns?part=month"
        required: false
        default: ""

concurrency:
  group: jobs-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  run:
    # On by default; set the repository variable JOBS_OFF to 1 to pause.
    if: ${{ vars.JOBS_OFF != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.job == 'export' && 90 || 10 }}
    env:
      # Public values (they ship in the site's own pages).
      NEXT_PUBLIC_SUPABASE_URL: https://katgjzkvscexswsqqooi.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_gl-0xbHB22lo7Tws3Lbb1Q_1lhncD_m
      JOBS_RELAY: https://weather.sswx.space/api/jobs/sb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pick the job
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "7,27,47 * * * *") echo "job=engines" >> "$GITHUB_OUTPUT" ;;
            "37 * * * *") echo "job=outdoor" >> "$GITHUB_OUTPUT" ;;
            "41 * * * *") echo "job=verify" >> "$GITHUB_OUTPUT" ;;
            "8,18,28,38,48,58 * * * *") echo "job=surge" >> "$GITHUB_OUTPUT" ;;
            "23 9 * * *") echo "job=indexnow" >> "$GITHUB_OUTPUT" ;;
            *) echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - run: npx tsx --conditions=react-server scripts/jobs/run.ts "$JOB" "$ARG"
        env:
          JOB: ${{ steps.pick.outputs.job }}
          ARG: ${{ inputs.arg }}
      # The project move: the export is sealed with a fresh key, itself sealed to the move's
      # public key (scripts/jobs/export-key.pub.txt), so only the holder of the private key can
      # open the artifact. Kept one day.
      - name: Seal the export
        if: steps.pick.outputs.job == 'export'
        run: |
          tar czf export.tgz export
          openssl rand -hex 32 > k
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in export.tgz -out export.tgz.enc -pass file:k
          openssl pkeyutl -encrypt -pubin -inkey scripts/jobs/export-key.pub.txt -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in k -out k.enc
          rm -rf export export.tgz k
          ls -l export.tgz.enc k.enc
      - name: Keep the sealed export
        if: steps.pick.outputs.job == 'export'
        uses: actions/upload-artifact@v4
        with:
          name: export
          path: |
            export.tgz.enc
            k.enc
          retention-days: 1
