<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img"
     aria-label="A radar sweep over a timing strip, with a hurricane track beside it">
  <title>Forecasts and Weather Data</title>

  <!--
    Drawn rather than photographed.

    A screenshot of a product is a thing only its owner can supply, and a grey
    rectangle standing in for one reads as broken. This is artwork: the three
    things VIP actually does, as a figure. It is replaced from the Admin Panel
    the day there is a real screenshot to put here.

    Flat shapes and no filters. This is a card image on a phone, and a blur or a
    drop shadow at this size costs a compositing pass to say nothing.
  -->

  <defs>
    <linearGradient id="vip-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111c2e"/>
    </linearGradient>
    <linearGradient id="vip-sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8fe6dd" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8fe6dd" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#vip-sky)"/>

  <!-- The radar, left. Rings, a sweep, and a cell with a hook on it. -->
  <g transform="translate(230 300)">
    <circle r="170" fill="#0e1a2b" stroke="#1e3350" stroke-width="2"/>
    <circle r="128" fill="none" stroke="#1e3350" stroke-width="1.5"/>
    <circle r="86" fill="none" stroke="#1e3350" stroke-width="1.5"/>
    <circle r="44" fill="none" stroke="#1e3350" stroke-width="1.5"/>
    <line x1="-170" y1="0" x2="170" y2="0" stroke="#1e3350" stroke-width="1.5"/>
    <line x1="0" y1="-170" x2="0" y2="170" stroke="#1e3350" stroke-width="1.5"/>

    <path d="M0 0 L170 0 A170 170 0 0 0 120 -120 Z" fill="url(#vip-sweep)"/>

    <!-- A supercell, with the hook a spotter is looking for. -->
    <path d="M-96 -34 q34 -46 76 -30 q40 -50 78 -8 q30 -6 30 26 q0 30 -34 34
             l-24 44 q-20 26 -46 6 q-26 26 -48 -4 q-32 6 -32 -30 q0 -30 0 -38 Z"
          fill="#f6b5da" opacity="0.9"/>
    <path d="M6 44 q-34 12 -40 44 q-4 26 22 30 q24 4 26 -22"
          fill="none" stroke="#f6b5da" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Expected Storm Timing, right. An hour strip with a window marked on it. -->
  <g transform="translate(470 150)">
    <rect width="260" height="120" rx="14" fill="#0e1a2b" stroke="#1e3350" stroke-width="2"/>
    <g fill="#8fe6dd">
      <rect x="22" y="72" width="16" height="26" rx="4" opacity="0.35"/>
      <rect x="50" y="58" width="16" height="40" rx="4" opacity="0.5"/>
      <rect x="78" y="34" width="16" height="64" rx="4" opacity="0.75"/>
      <rect x="106" y="20" width="16" height="78" rx="4"/>
      <rect x="134" y="30" width="16" height="68" rx="4" opacity="0.8"/>
      <rect x="162" y="52" width="16" height="46" rx="4" opacity="0.55"/>
      <rect x="190" y="70" width="16" height="28" rx="4" opacity="0.4"/>
      <rect x="218" y="82" width="16" height="16" rx="4" opacity="0.3"/>
    </g>
    <rect x="98" y="14" width="60" height="90" rx="8"
          fill="none" stroke="#f6b5da" stroke-width="3"/>
  </g>

  <!-- The hurricane track, right and below. A forecast cone with a spiral in it. -->
  <g transform="translate(470 320)">
    <rect width="260" height="200" rx="14" fill="#0e1a2b" stroke="#1e3350" stroke-width="2"/>
    <path d="M28 168 q54 -40 92 -74 q40 -36 112 -58" fill="none"
          stroke="#8fe6dd" stroke-width="3" stroke-dasharray="9 8" stroke-linecap="round"/>
    <path d="M28 176 q60 -36 100 -70 q44 -38 108 -64 l0 -26
             q-76 28 -124 68 q-42 34 -96 76 Z" fill="#8fe6dd" opacity="0.14"/>
    <g transform="translate(196 44)">
      <circle r="26" fill="none" stroke="#f6b5da" stroke-width="3"/>
      <path d="M0 -26 q22 6 20 26 M0 26 q-22 -6 -20 -26"
            fill="none" stroke="#f6b5da" stroke-width="6" stroke-linecap="round"/>
      <circle r="5" fill="#f6b5da"/>
    </g>
  </g>
</svg>
